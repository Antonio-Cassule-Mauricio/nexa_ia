    <script>
      /**
       * Interceptor de WebSocket para o cliente do Vite HMR:
       * Em ambientes em nuvem protegidos por proxy reverso (Cloud Run/Sandbox),
       * o WebSocket do HMR não consegue abrir e lança 'WebSocket closed without opened'.
       * Este dummy socket simula conexão aberta imediata para o Vite, eliminando 100% dos erros no console.
       */
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OriginalWS = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const isViteHmr = (typeof url === 'string' && (url.includes('@vite') || url.includes('vite-hmr'))) ||
                              (typeof protocols === 'string' && protocols.includes('vite-hmr')) ||
                              (Array.isArray(protocols) && protocols.includes('vite-hmr'));
            if (isViteHmr) {
              const mockWs = {
                readyState: 1, // WebSocket.OPEN
                url: url,
                protocol: 'vite-hmr',
                extensions: '',
                binaryType: 'blob',
                bufferedAmount: 0,
                send: function() {},
                close: function() {},
                addEventListener: function(type, listener) {
                  if (type === 'open') {
                    setTimeout(function() {
                      if (typeof listener === 'function') listener(new Event('open'));
                    }, 5);
                  }
                },
                removeEventListener: function() {},
                dispatchEvent: function() { return true; },
                onopen: null,
                onmessage: null,
                onerror: null,
                onclose: null
              };
              setTimeout(function() {
                if (typeof mockWs.onopen === 'function') {
                  mockWs.onopen(new Event('open'));
                }
              }, 5);
              return mockWs;
            }
            return new OriginalWS(url, protocols);
          };
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
          window.WebSocket.prototype = OriginalWS.prototype;

          // Interceptar eventuais rejeições não tratadas
          window.addEventListener('unhandledrejection', function(e) {
            if (e.reason && (
              (e.reason.message && e.reason.message.toLowerCase().includes('websocket')) ||
              String(e.reason).toLowerCase().includes('websocket')
            )) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          });
        }
      })();
    </script>
